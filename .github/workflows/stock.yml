name: Stock check

on:
  schedule:
      - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking stock"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Send test email
        if: ${{ inputs.test_email }}
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python stock_check.py --test-email

      - name: Check stock
        if: ${{ !inputs.test_email }}
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python stock_check.py

      - name: Save state (only when it changed)
        if: ${{ !inputs.test_email }}
        run: |
          if [ -n "$(git status --porcelain last_state.txt)" ]; then
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add last_state.txt
            git commit -m "Update stock state"
            git push
          fi
